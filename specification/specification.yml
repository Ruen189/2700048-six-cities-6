openapi: 3.0.3
info:
  title: Six Cities REST API
  description: REST API сервиса «Шесть городов» — платформа для аренды жилья в шести европейских городах.
  version: 4.0.0

servers:
  - url: http://localhost:4000
    description: Development server

tags:
  - name: offers
    description: Действия с предложениями по аренде
  - name: comments
    description: Действия с комментариями
  - name: users
    description: Действия с пользователями
  - name: favorites
    description: Действия с избранными предложениями

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ---------- Enums ----------
    City:
      type: string
      enum:
        - Paris
        - Cologne
        - Brussels
        - Amsterdam
        - Hamburg
        - Dusseldorf

    OfferType:
      type: string
      enum:
        - apartment
        - house
        - room
        - hotel

    UserType:
      type: string
      enum:
        - ordinary
        - pro

    Facility:
      type: string
      enum:
        - Breakfast
        - Air conditioning
        - Laptop friendly workspace
        - Baby seat
        - Washer
        - Towels
        - Fridge

    # ---------- Sub-objects ----------
    Location:
      type: object
      properties:
        latitude:
          type: number
          example: 52.370216
        longitude:
          type: number
          example: 4.895168
      required:
        - latitude
        - longitude

    # ---------- User ----------
    UserResponse:
      type: object
      properties:
        id:
          type: string
          example: 6329c3d6a04ab1061c6425ea
        name:
          type: string
          minLength: 1
          maxLength: 15
          example: Alex
        email:
          type: string
          format: email
          example: alex@example.com
        avatarUrl:
          type: string
          example: avatar-alex.jpg
        type:
          $ref: '#/components/schemas/UserType'
      required:
        - id
        - name
        - email
        - type

    CreateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 15
          example: Alex
        email:
          type: string
          format: email
          example: alex@example.com
        password:
          type: string
          minLength: 6
          maxLength: 12
          example: qwerty1
        type:
          $ref: '#/components/schemas/UserType'
        avatarUrl:
          type: string
          example: avatar-alex.jpg
      required:
        - name
        - email
        - password
        - type

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: alex@example.com
        password:
          type: string
          example: qwerty1
      required:
        - email
        - password

    AuthToken:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    # ---------- Offer (short — for lists) ----------
    OfferShort:
      type: object
      properties:
        id:
          type: string
          example: 6329c3d6a04ab1061c6425eb
        title:
          type: string
          example: Canal view studio
        postDate:
          type: string
          format: date-time
        city:
          $ref: '#/components/schemas/City'
        previewImage:
          type: string
          example: img/studio-01.jpg
        isPremium:
          type: boolean
        isFavorite:
          type: boolean
        rating:
          type: number
          minimum: 1
          maximum: 5
          example: 4.5
        type:
          $ref: '#/components/schemas/OfferType'
        price:
          type: integer
          minimum: 100
          maximum: 100000
          example: 200
        commentCount:
          type: integer
          example: 3
      required:
        - id
        - title
        - postDate
        - city
        - previewImage
        - isPremium
        - isFavorite
        - rating
        - type
        - price
        - commentCount

    # ---------- Offer (full — for detail / create / update) ----------
    OfferDetail:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          minLength: 10
          maxLength: 100
        description:
          type: string
          minLength: 20
          maxLength: 1024
        postDate:
          type: string
          format: date-time
        city:
          $ref: '#/components/schemas/City'
        previewImage:
          type: string
        images:
          type: array
          items:
            type: string
          minItems: 6
          maxItems: 6
        isPremium:
          type: boolean
        isFavorite:
          type: boolean
        rating:
          type: number
          minimum: 1
          maximum: 5
        type:
          $ref: '#/components/schemas/OfferType'
        bedrooms:
          type: integer
          minimum: 1
          maximum: 8
        maxAdults:
          type: integer
          minimum: 1
          maximum: 10
        price:
          type: integer
          minimum: 100
          maximum: 100000
        goods:
          type: array
          items:
            $ref: '#/components/schemas/Facility'
          minItems: 1
        host:
          $ref: '#/components/schemas/UserResponse'
        commentCount:
          type: integer
        location:
          $ref: '#/components/schemas/Location'
      required:
        - id
        - title
        - description
        - postDate
        - city
        - previewImage
        - images
        - isPremium
        - isFavorite
        - rating
        - type
        - bedrooms
        - maxAdults
        - price
        - goods
        - host
        - commentCount
        - location

    CreateOfferRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 10
          maxLength: 100
          example: Stylish apartment in city center
        description:
          type: string
          minLength: 20
          maxLength: 1024
          example: Modern stylish apartment in the very heart of the city.
        city:
          $ref: '#/components/schemas/City'
        previewImage:
          type: string
          example: img/apartment-01.jpg
        images:
          type: array
          items:
            type: string
          minItems: 6
          maxItems: 6
        isPremium:
          type: boolean
        type:
          $ref: '#/components/schemas/OfferType'
        bedrooms:
          type: integer
          minimum: 1
          maximum: 8
        maxAdults:
          type: integer
          minimum: 1
          maximum: 10
        price:
          type: integer
          minimum: 100
          maximum: 100000
        goods:
          type: array
          items:
            $ref: '#/components/schemas/Facility'
          minItems: 1
        location:
          $ref: '#/components/schemas/Location'
      required:
        - title
        - description
        - city
        - previewImage
        - images
        - isPremium
        - type
        - bedrooms
        - maxAdults
        - price
        - goods
        - location

    UpdateOfferRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 10
          maxLength: 100
        description:
          type: string
          minLength: 20
          maxLength: 1024
        city:
          $ref: '#/components/schemas/City'
        previewImage:
          type: string
        images:
          type: array
          items:
            type: string
          minItems: 6
          maxItems: 6
        isPremium:
          type: boolean
        type:
          $ref: '#/components/schemas/OfferType'
        bedrooms:
          type: integer
          minimum: 1
          maximum: 8
        maxAdults:
          type: integer
          minimum: 1
          maximum: 10
        price:
          type: integer
          minimum: 100
          maximum: 100000
        goods:
          type: array
          items:
            $ref: '#/components/schemas/Facility'
          minItems: 1
        location:
          $ref: '#/components/schemas/Location'

    # ---------- Comment ----------
    CommentResponse:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        createdAt:
          type: string
          format: date-time
        rating:
          type: integer
          minimum: 1
          maximum: 5
        user:
          $ref: '#/components/schemas/UserResponse'
      required:
        - id
        - text
        - createdAt
        - rating
        - user

    CreateCommentRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 5
          maxLength: 1024
          example: Great apartment, really enjoyed my stay!
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
      required:
        - text
        - rating

    # ---------- Error ----------
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Validation error
        details:
          type: array
          items:
            type: string

  parameters:
    offerId:
      name: offerId
      in: path
      required: true
      schema:
        type: string
      description: Идентификатор предложения
    cityName:
      name: city
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/City'
      description: Название города

paths:
  # ==================== OFFERS ====================
  /offers:
    get:
      tags: [offers]
      summary: Получить список предложений по аренде
      description: |
        Возвращает список предложений, отсортированный по дате публикации (по убыванию).
        По умолчанию не больше 60. Параметр limit позволяет запросить больше.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 60
          description: Количество предложений
      responses:
        '200':
          description: Список предложений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfferShort'

    post:
      tags: [offers]
      summary: Создать новое предложение
      description: Доступно только авторизованным клиентам.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOfferRequest'
      responses:
        '201':
          description: Предложение создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferDetail'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован

  /offers/{offerId}:
    parameters:
      - $ref: '#/components/parameters/offerId'

    get:
      tags: [offers]
      summary: Получить детальную информацию о предложении
      description: Доступно анонимным и авторизованным клиентам.
      responses:
        '200':
          description: Детальная информация о предложении
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferDetail'
        '404':
          description: Предложение не найдено

    patch:
      tags: [offers]
      summary: Редактировать предложение
      description: Клиент может редактировать только свои предложения.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOfferRequest'
      responses:
        '200':
          description: Предложение обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferDetail'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
        '403':
          description: Нет доступа (чужое предложение)
        '404':
          description: Предложение не найдено

    delete:
      tags: [offers]
      summary: Удалить предложение
      description: Удаляет предложение и все связанные комментарии. Только автор предложения.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Предложение удалено
        '401':
          description: Не авторизован
        '403':
          description: Нет доступа (чужое предложение)
        '404':
          description: Предложение не найдено

  # ==================== PREMIUM OFFERS ====================
  /offers/premium/{city}:
    parameters:
      - $ref: '#/components/parameters/cityName'

    get:
      tags: [offers]
      summary: Получить список премиальных предложений для города
      description: Возвращает не больше 3 премиальных предложений, отсортированных по дате (по убыванию).
      responses:
        '200':
          description: Список премиальных предложений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfferShort'
                maxItems: 3

  # ==================== COMMENTS ====================
  /offers/{offerId}/comments:
    parameters:
      - $ref: '#/components/parameters/offerId'

    get:
      tags: [comments]
      summary: Получить список комментариев для предложения
      description: Возвращает до 50 последних комментариев, отсортированных по дате (по убыванию).
      responses:
        '200':
          description: Список комментариев
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentResponse'
                maxItems: 50
        '404':
          description: Предложение не найдено

    post:
      tags: [comments]
      summary: Добавить комментарий к предложению
      description: Доступно только авторизованным клиентам.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Комментарий создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
        '404':
          description: Предложение не найдено

  # ==================== FAVORITES ====================
  /favorites:
    get:
      tags: [favorites]
      summary: Получить список избранных предложений
      description: Доступно только авторизованным клиентам.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список избранных предложений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfferShort'
        '401':
          description: Не авторизован

  /favorites/{offerId}:
    parameters:
      - $ref: '#/components/parameters/offerId'

    post:
      tags: [favorites]
      summary: Добавить предложение в избранное
      description: Доступно только авторизованным клиентам.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Предложение добавлено в избранное
        '401':
          description: Не авторизован
        '404':
          description: Предложение не найдено

    delete:
      tags: [favorites]
      summary: Удалить предложение из избранного
      description: Доступно только авторизованным клиентам.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Предложение удалено из избранного
        '401':
          description: Не авторизован
        '404':
          description: Предложение не найдено

  # ==================== USERS ====================
  /users/register:
    post:
      tags: [users]
      summary: Создать нового пользователя
      description: Доступно только анонимным клиентам. Email должен быть уникальным.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Пользователь с таким email уже существует

  /users/login:
    post:
      tags: [users]
      summary: Войти в закрытую часть приложения
      description: Клиент передаёт email и пароль. В ответ получает JWT-токен.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешная авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '401':
          description: Неверный email или пароль

    get:
      tags: [users]
      summary: Проверить состояние авторизации пользователя
      description: Проверяет токен из заголовка. Возвращает информацию о пользователе, если авторизован.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Пользователь авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Не авторизован

  /users/logout:
    delete:
      tags: [users]
      summary: Выйти из закрытой части приложения
      description: Завершает пользовательский сеанс. Доступно только авторизованным клиентам.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Сеанс завершён
        '401':
          description: Не авторизован
